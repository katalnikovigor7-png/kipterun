<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1210"/>
      <stop offset="1" stop-color="#2b170c"/>
    </linearGradient>
    <radialGradient id="gl" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.6  0 0 0 0 0.4  0 0 0 0 0.25  0 0 0 0.5 0"/>
