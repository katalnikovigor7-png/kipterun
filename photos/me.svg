  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#gl)"/>
  <g fill="none" stroke="#ff8a1f" stroke-opacity=".7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="400" cy="400" r="86"/>
    <path d="M215 700 C215 590 295 530 400 530 C505 530 585 590 585 700"/>
  </g>
  <text x="400" y="830" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#d9c9b8" fill-opacity=".85">Ваше фото</text>
  <rect width="800" height="1000" filter="url(#g)" opacity=".2"/>
</svg>
